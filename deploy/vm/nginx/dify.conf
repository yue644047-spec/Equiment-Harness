# Dify 反向代理配置（原生部署版）
# 放置位置：/etc/nginx/conf.d/dify.conf
# 路由规则逐条对照官方 docker/nginx/conf.d/default.conf.template

upstream dify_api {
    server 127.0.0.1:5001;
    keepalive 32;
}
upstream dify_web {
    server 127.0.0.1:3000;
    keepalive 32;
}
upstream dify_plugin_daemon {
    server 127.0.0.1:5002;
    keepalive 8;
}

server {
    listen       80;
    server_name  _;

    # 知识库文档上传：官方默认 15M，装备资料可能有较大 PDF，放宽到 100M
    client_max_body_size 100M;

    # 长耗时请求（工作流执行、知识库索引）超时放宽
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    access_log /data/dify/logs/nginx-access.log;
    error_log  /data/dify/logs/nginx-error.log warn;

    location /console/api {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location /api {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location /v1 {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location /openapi {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location /files {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location /mcp {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location /triggers {
        proxy_pass http://dify_api;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }

    # WebSocket（工作流协作）。原生部署下 api 进程同时承担 websocket
    location /socket.io/ {
        proxy_pass http://dify_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }

    # 插件 daemon 的 Webhook 回调入口
    location /e/ {
        proxy_pass http://dify_plugin_daemon;
        proxy_set_header Dify-Hook-Url $scheme://$host$request_uri;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }

    location /explore {
        proxy_pass http://dify_web;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
    location / {
        proxy_pass http://dify_web;
        include /etc/nginx/conf.d/dify-proxy.inc;
    }
}
