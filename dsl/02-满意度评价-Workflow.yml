app:
  description: 满意度评价与指标计算。按「主观评价 + 客观评价」两个维度共 9 项指标打分：主观 3 项来自用户（满意度/有用性/体验感），客观 6 项由大模型评委给出（事实准确性/知识完备性/相关性 + 装备域专项 安全合规性/版本时效性/术语规范性），计算 SSI/OSI/CSI 并给出 verdict、标注标签、错误归因与 badcase 分级。
  icon: 📊
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: 满意度评价与指标计算（主观3项 + 客观6项）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: '0.7.0'
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
