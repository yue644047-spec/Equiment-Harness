          type: knowledge-retrieval
        height: 96
        id: '1700000000006'
        position:
          x: 700
          y: 420
        positionAbsolute:
          x: 700
          y: 420
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          _targetBranches:
            - id: 'true'
              name: IF
            - id: 'false'
              name: ELSE
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: empty
                  id: 1700000000007-cond-1
                  value: ''
                  varType: array[object]
                  variable_selector:
                    - '1700000000006'
                    - result
              id: 'true'
              logical_operator: and
          desc: 判断知识库是否召回内容：IF=召回为空走兜底，ELSE=正常作答
          selected: false
          title: 是否召回为空
          type: if-else
        height: 120
        id: '1700000000007'
        position:
          x: 1020
          y: 420
        positionAbsolute:
          x: 1020
          y: 420
