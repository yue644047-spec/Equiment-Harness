app:
  description: 基于装备技术资料知识库的智能问答助手，覆盖原理、操作规程、维修规程与故障案例四类资料，内置满意度采集与改进建议收集通道，为资料完备性、术语规范性与版本时效性评价提供原始数据。
  icon: 💬
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 装备技术资料智能问答助手（知识库增强 + 满意度采集）
  use_icon_as_answer_icon: false
kind: app
version: '0.7.0'
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: |
      你好，我是装备技术资料智能问答助手 👋
      你可以提问装备原理、技术参数、操作规程、维修规程、故障排除等问题，我会基于知识库中的技术资料作答，并标注引用的资料编号与版本。
      涉及操作与维修的问题，我会完整给出安全前置条件与禁止事项。
      如果回答的参数、术语、版本引用或安全条款有误，请点 👎 或直接发送：#评价 4 你的改进建议（4 换成 1-5 的分数），你的反馈会用于补充资料、校正术语与版本并优化回答质量。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 这套知识库覆盖了哪些装备技术资料
      - 滤芯多久需要更换一次
      - 维修作业前必须完成哪些安全准备
      - 举升到位后缓慢下沉可能是什么原因
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
