    nodes:
      - data:
          desc: 对话入口，用户输入通过 sys.query 传入
          selected: false
          title: 开始
          type: start
          variables: []
        height: 60
        id: '1700000000001'
        position:
          x: 60
          y: 300
        positionAbsolute:
          x: 60
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          classes:
            - id: '1'
              name: 满意度评价
            - id: '2'
              name: 知识问答
          desc: 区分「用户对上次回答的评价反馈」与「新的知识提问」
          instruction: |
            请判断用户输入属于以下哪一类，只输出类别，不要解释。
            1. 满意度评价：用户在针对之前的回答进行打分、点赞点踩或提出改进建议。典型形式：
               - 以 #评价 开头，后接 1-5 的分数和/或文字建议，例如「#评价 4 力矩值不对，应为 180 N·m」
               - 「这个回答不对」「答非所问」「不够详细，应该说明……」「很好，谢谢」等对上一轮回答质量的主观评价
               - 针对资料本身的反馈，例如「这个参数是作废版本的」「步骤里漏了泄压要求」「术语用得不对」
            2. 知识问答：用户在询问装备原理、技术参数、操作规程、维修规程、故障现象与排除方法等具体问题，期望获得答案。
            判断依据：若输入的主要内容是对上一轮回答质量、准确性、完整性的评价或改进诉求，归入第 1 类；
            若输入是在寻求新的信息或答案，归入第 2 类。两者都像时，以「是否在索取新信息」为准。
            注意区分：「这个力矩值是多少」是知识问答；「这个力矩值写错了」是满意度评价。
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: deepseek-flash
            provider: langgenius/deepseek/deepseek
          query_variable_selector:
            - sys
            - query
          selected: false
          title: 意图识别
          topics: []
          type: question-classifier
          vision:
            enabled: false
        height: 120
        id: '1700000000002'
        position:
          x: 380
          y: 300
        positionAbsolute:
          x: 380
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 从评价语句中抽取满意度评分与改进建议
          instruction: |
            从用户的评价语句中提取两个字段。
            - score：满意度评分，1-5 的整数。若用户明确给出数字（如「4分」「#评价 4」）直接采用；
              若只表达态度，按以下规则映射：非常满意/很好/完美=5，满意/不错=4，一般/还行=3，
              不太满意/有待改进=2，很不满意/很差/错误=1。
              无法判断时，若整体语气为正面取 4，负面取 2。
            - suggestion：用户提出的改进建议原文，保留用户原始表述，不要改写、不要总结。
              用户没有提出任何建议时，返回空字符串。
          model:
            completion_params:
              temperature: 0.1
            mode: chat
            name: deepseek-flash
            provider: langgenius/deepseek/deepseek
          parameters:
            - description: 满意度评分，1 到 5 的整数。用户只表达满意程度时按正面取高分、负面取低分的规则推断
              name: score
              required: true
              type: number
            - description: 用户提出的改进建议原文；没有建议时为空字符串
              name: suggestion
              required: false
              type: string
          query:
            - sys
            - query
          reasoning_mode: prompt
          selected: false
          title: 提取评分与建议
          type: parameter-extractor
          vision:
            enabled: false
        height: 120
        id: '1700000000003'
        position:
          x: 700
          y: 120
        positionAbsolute:
          x: 700
          y: 120
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 生成评价回执。回执正文供用户阅读，末尾 [[EVAL_RECEIPT]] 标记供评测服务自动解析，勿随意改动字段名
          selected: false
          template: |
            ✅ 已记录你的评价，感谢反馈！

            - 满意度评分：{{ score }} / 5
            - 改进建议：{{ suggestion }}

            我们会据此补充装备技术资料、校正术语与版本引用，并优化回答质量。
            [[EVAL_RECEIPT]]score={{ score }},suggestion={{ suggestion }}[[/EVAL_RECEIPT]]
          title: 评价回执
          type: template-transform
          variables:
            - value_selector:
                - '1700000000003'
                - score
              variable: score
            - value_selector:
                - '1700000000003'
                - suggestion
              variable: suggestion
        height: 120
        id: '1700000000004'
        position:
          x: 1020
          y: 120
        positionAbsolute:
          x: 1020
          y: 120
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#1700000000004.output#}}'
          desc: 回复评价回执
          selected: false
          title: 回复评价回执
          type: answer
          variables: []
        height: 120
        id: '1700000000005'
        position:
          x: 1340
          y: 120
        positionAbsolute:
          x: 1340
          y: 120
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          dataset_ids:
            - 00000000-0000-0000-0000-000000000000
          desc: 从装备技术资料知识库召回相关片段。装备资料参数密集、型号与版本易混淆，建议 top_k 不低于 6，并在部署时开启 rerank（见 docs/02）。导入后请把 dataset_ids 换成你自己的知识库 ID
          metadata_filtering_mode: disabled
