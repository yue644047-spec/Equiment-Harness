      - data:
          answer: |
            {{#1700000000008.text#}}

            ---
            💡 如果这个回答有帮助，请点 👍；如果参数、术语、版本引用或安全条款有误，请点 👎，或直接发送：#评价 4 你的改进建议（4 换成 1-5 的分数）。你的反馈会用于补充装备技术资料并优化回答质量。
          desc: 输出知识库答案并引导用户评价
          selected: false
          title: 回答（知识库）
          type: answer
          variables: []
        height: 120
