app:
  description: 把装备技术资料批量转化为可入库的问答语料并自动完成标注：抽取问答对、标注问题类型/资料类型/难度/关键词/原文依据/技术参数/安全条款/质量分，扫描残留的作废版本数值，输出可直接消费的 JSONL 与 Markdown 复核表。
  icon: 🏷️
  icon_background: '#D5F5F6'
  icon_type: emoji
  mode: workflow
  name: 装备资料语料标注与问答对抽取（数据库标注）
  use_icon_as_answer_icon: false
kind: app
version: '0.7.0'
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: 1720000000001-source-1720000000002-target
        selected: false
        source: '1720000000001'
        sourceHandle: source
        target: '1720000000002'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: 1720000000002-source-1720000000003-target
        selected: false
        source: '1720000000002'
        sourceHandle: source
        target: '1720000000003'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: template-transform
        id: 1720000000003-source-1720000000004-target
        selected: false
        source: '1720000000003'
        sourceHandle: source
        target: '1720000000004'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: template-transform
          targetType: end
        id: 1720000000004-source-1720000000005-target
        selected: false
        source: '1720000000004'
        sourceHandle: source
        target: '1720000000005'
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 输入待标注文档。文档较长时建议在外部按章节切分后逐段调用
          selected: false
          title: 开始
          type: start
          variables:
            - label: 文档正文
              max_length: 65535
              required: true
              type: paragraph
              variable: document_text
            - label: 文档标题
              max_length: 256
              required: true
              type: text-input
              variable: doc_title
            - label: 资料类别（原理/操作规程/维修规程/故障案例/资料管理/术语）
              max_length: 128
              required: false
              type: text-input
              variable: business_domain
            - label: 最多抽取问答对数量
              max_length: 8
              required: false
              type: text-input
              variable: max_pairs
        height: 200
        id: '1720000000001'
        position:
          x: 60
          y: 300
        positionAbsolute:
          x: 60
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 从文档抽取问答对并完成标注，只输出 JSON
          model:
            completion_params:
              temperature: 0.2
              top_p: 1
            mode: chat
            name: deepseek-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - id: 1720000000002-prompt-system
              role: system
              text: |
                你是装备技术资料语料标注专家。你的任务是把一份原始装备技术资料，转化为可直接入库的「问答对 + 标注信息」，供装备技术资料智能问答系统检索使用。

                装备资料的四大类别：原理（工作原理、组成、回路）、操作规程（作业前检查、启停、监控、应急处置、安全禁止事项）、
                维修规程（保养周期、拆装顺序、力矩、检测参数、试车验收）、故障案例（现象、原因、排除步骤、处置）。

                【抽取要求】
                1. 只依据原文内容生成问答对，禁止引入文档之外的知识或外部推断。
                2. 每条问答对必须自包含：用户只看问题和答案就能理解，不依赖上下文。避免出现「上述」「该条款」「本文」等指代。
                3. 问题要贴近保障人员的真实提问口吻，长度 8-40 字；答案要完整、准确、可直接使用。
                4. **涉及技术参数、力矩、周期、温度、压力、负载、资料编号、条款编号时，必须与原文完全一致，不得改写、换算、取整或省略单位。**
                5. 涉及操作、维修、拆装、应急处置的问答对，**必须完整保留原文的安全警示与禁止事项**，不得为了简洁而删减安全条款。
                6. 优先覆盖：技术参数、保养周期、操作步骤与安全前置条件、禁止事项、故障现象与排除步骤、术语与缩略语含义。
                7. 同一知识点只保留一条问答对，避免同义重复。
                8. 抽取数量不超过用户指定的 max_pairs。

                【每条问答对需要标注的字段】
                - question：问题原文
                - answer：答案原文
                - question_type：原理型 / 参数型 / 操作型 / 维修型 / 排故型 / 管理型
                - material_type：原理 / 操作规程 / 维修规程 / 故障案例 / 资料管理 / 术语
                - difficulty：简单 / 中等 / 困难
                - keywords：3-6 个检索关键词数组
                - source_quote：支撑该答案的原文片段（原样摘录，不超过 120 字）
                - param_values：该问答涉及的关键技术参数值数组，格式为「参数名 数值 单位」，例如 ["油缸缸盖螺栓力矩 180 N·m", "滤芯更换周期 500 工作小时"]；不涉及参数时为空数组
                - safety_related：布尔值，涉及安全警示、禁止事项、应急处置或人身/装备安全时为 true
                - doc_no：资料来源编号（如 HYS-WX-003）；原文未给出时为空字符串
                - doc_version：资料来源版本号（如 V2.0）；原文未给出时为空字符串
                - quality_score：1-5 的整数，标注质量自评分。5=答案完整准确且原文依据充分；4=基本完整；3=信息偏少或依赖单一句子；2=存在歧义或依据不足；1=无法确认依据
                - need_human_review：布尔值，当 quality_score 小于 4、或涉及安全条款/技术参数/版本信息、或原文表述存在歧义时为 true
                - review_reason：需要人工复核的原因；不需要复核时为空字符串

                【输出要求】
                只输出一个合法 JSON 对象，不要输出任何解释或 Markdown 代码块标记：
                {
                  "qa_pairs": [ { "question": "", "answer": "", "question_type": "", "material_type": "", "difficulty": "", "keywords": [""], "source_quote": "", "param_values": [""], "safety_related": false, "doc_no": "", "doc_version": "", "quality_score": 5, "need_human_review": false, "review_reason": "" } ],
                  "doc_summary": "用一句话概括本文档主题",
                  "coverage_gaps": ["资料中表述不清、缺少配套说明、或版本信息缺失、需要技术部门补充的点"]
                }
            - id: 1720000000002-prompt-user
              role: user
              text: |
                【文档标题】
                {{#1720000000001.doc_title#}}

                【资料类别】
                {{#1720000000001.business_domain#}}

                【最多抽取问答对数量】
                {{#1720000000001.max_pairs#}}

                【文档正文】
                {{#1720000000001.document_text#}}

                请按要求抽取问答对并完成标注，只输出 JSON。
          selected: false
          title: 问答对抽取与标注
          type: llm
          vision:
            enabled: false
        height: 160
        id: '1720000000002'
        position:
          x: 380
          y: 300
        positionAbsolute:
          x: 380
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import datetime
            import json
            import re


            def _extract_json(raw: str) -> dict:
                """从模型输出中稳健地抽取 JSON 对象。"""
                if not raw:
                    return {}
                text = str(raw).strip()
                text = re.sub(r"^\s*```(?:json)?", "", text).strip()
                text = re.sub(r"```\s*$", "", text).strip()
                start = text.find("{")
                end = text.rfind("}")
                if start == -1 or end == -1 or end <= start:
                    return {}
                candidate = text[start:end + 1]
                try:
                    return json.loads(candidate)
                except Exception:
                    pass
                fixed = re.sub(r",\s*([\]}])", r"\1", candidate)
                try:
                    return json.loads(fixed)
                except Exception:
                    return {}


            def _normalize(text) -> str:
                return re.sub(r"\s+", "", str(text or "")).lower()


            def _to_int(value, default=3):
                try:
                    return int(round(float(value)))
                except Exception:
                    return default


            #: 已作废版本中的数值：语料中出现即必须在入库前确认，避免作废值进入知识库
            OBSOLETE_PATTERNS = {
                "300 工作小时": "滤芯更换周期（HYS-CZ-002 V3.0 作废值，现行 V4.0 已修订为 500 工作小时）",
                "14 MPa": "额定工作压力（HYS-GY-001 V2.0 作废值，现行 V3.0 已修订为 16 MPa）",
            }


            def _obsolete_warnings(rows) -> list:
                """扫描语料中是否残留已作废版本的数值。"""
                text = " ".join(
                    str(r.get("answer") or "") + str(r.get("source_quote") or "") for r in rows
                )
                return [
                    "语料中出现已作废版本数值「%s」：%s" % (key, note)
                    for key, note in OBSOLETE_PATTERNS.items() if key in text
                ]


            def _material_type(doc_title: str, domain: str) -> str:
                """按标题与资料类别推断资料类型。"""
                text = "%s%s" % (doc_title or "", domain or "")
                for key, name in (
                    ("原理", "原理"), ("操作", "操作规程"), ("维修", "维修规程"),
                    ("故障", "故障案例"), ("案例", "故障案例"),
                    ("台账", "资料管理"), ("清单", "资料管理"),
                    ("术语", "术语"), ("缩略语", "术语"),
                ):
                    if key in text:
                        return name
                return "其他"


            def main(raw: str, doc_title: str, business_domain: str, max_pairs: str) -> dict:
                data = _extract_json(raw)
                items = data.get("qa_pairs") or []
                try:
                    limit = _to_int(max_pairs, 10)
                except Exception:
                    limit = 10
                limit = max(1, min(limit, 100))

                results = []
                seen = set()
                for item in items:
                    if not isinstance(item, dict):
                        continue
                    question = str(item.get("question") or "").strip()
                    answer = str(item.get("answer") or "").strip()
                    if not question or not answer:
                        continue
                    key = _normalize(question)
                    if key in seen:
                        continue
                    seen.add(key)

                    quality = _to_int(item.get("quality_score", 3), 3)
                    quality = max(1, min(5, quality))
                    need_review = item.get("need_human_review")
                    if not isinstance(need_review, bool):
                        need_review = quality < 4

                    safety_related = bool(item.get("safety_related"))
                    params = item.get("param_values")
                    if not isinstance(params, list):
                        params = []
                    params = [str(v).strip() for v in params if str(v).strip()]
                    reason = str(item.get("review_reason") or "").strip()
                    if not reason and quality < 4:
                        reason = "质量分低于 4，建议人工复核"
                    if (safety_related or params) and not need_review:
                        # 安全条款与技术参数必须经技术专家确认后才能入库
                        need_review = True
                        reason = reason or "涉及安全条款或技术参数，须技术专家确认"

                    results.append({
                        "question": question,
                        "answer": answer,
                        "question_type": item.get("question_type") or "原理型",
                        "material_type": item.get("material_type") or _material_type(doc_title, business_domain),
                        "difficulty": item.get("difficulty") or "中等",
                        "keywords": item.get("keywords") or [],
                        "source_quote": item.get("source_quote") or "",
                        "param_values": params,
                        "safety_related": safety_related,
                        "doc_no": str(item.get("doc_no") or "").strip(),
                        "doc_version": str(item.get("doc_version") or "").strip(),
                        "quality_score": quality,
                        "need_human_review": need_review,
                        "review_reason": reason,
                        "doc_title": doc_title,
                        "business_domain": business_domain,
                        "review_status": "待复核",
                    })
                    if len(results) >= limit:
                        break

                results.sort(key=lambda row: (-row["quality_score"], row["question"]))
                jsonl = "\n".join(json.dumps(row, ensure_ascii=False) for row in results)
                total = len(results)
                avg_quality = round(sum(row["quality_score"] for row in results) / total, 2) if total else 0
                obsolete = _obsolete_warnings(results)
                stats = {
                    "total": total,
                    "avg_quality": avg_quality,
                    "need_review": sum(1 for row in results if row["need_human_review"]),
                    "safety_related": sum(1 for row in results if row["safety_related"]),
                    "param_related": sum(1 for row in results if row["param_values"]),
                    "type_distribution": {},
                    "difficulty_distribution": {},
                    "material_type_distribution": {},
                    "obsolete_warnings": len(obsolete),
                }
                for row in results:
                    stats["type_distribution"][row["question_type"]] = stats["type_distribution"].get(row["question_type"], 0) + 1
                    stats["difficulty_distribution"][row["difficulty"]] = stats["difficulty_distribution"].get(row["difficulty"], 0) + 1
                    stats["material_type_distribution"][row["material_type"]] = stats["material_type_distribution"].get(row["material_type"], 0) + 1

                return {
                    "qa_pairs": results,
                    "qa_count": total,
                    "jsonl": jsonl,
                    "generated_at": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                    "stats_json": json.dumps(stats, ensure_ascii=False),
                    "doc_summary": data.get("doc_summary") or "",
                    "coverage_gaps": (data.get("coverage_gaps") or []) + obsolete,
                    "obsolete_warnings": obsolete,
                }

          code_language: python3
          desc: 解析标注结果、去重、按质量分排序、生成 JSONL 与统计
          outputs:
            coverage_gaps:
              children: null
              type: array[string]
            doc_summary:
              children: null
              type: string
            generated_at:
              children: null
              type: string
            jsonl:
              children: null
              type: string
            qa_count:
              children: null
              type: number
            obsolete_warnings:
              children: null
              type: array[string]
            qa_pairs:
              children: null
              type: array[object]
            stats_json:
              children: null
              type: string
          selected: false
          title: 解析与质检
          type: code
          variables:
            - value_selector:
                - '1720000000002'
                - text
              variable: raw
            - value_selector:
                - '1720000000001'
                - doc_title
              variable: doc_title
            - value_selector:
                - '1720000000001'
                - business_domain
              variable: business_domain
            - value_selector:
                - '1720000000001'
                - max_pairs
              variable: max_pairs
        height: 160
        id: '1720000000003'
        position:
          x: 700
          y: 300
        positionAbsolute:
          x: 700
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 生成人工复核用的 Markdown 表格
          selected: false
          template: |
            # 语料标注结果：{{ title }}

            | 项目 | 值 |
            | --- | --- |
            | 文档标题 | {{ title }} |
            | 业务领域 | {{ domain }} |
            | 抽取问答对 | {{ qa_count }} 条 |
            | 生成时间 | {{ generated_at }} |

            ## 一、标注明细（质量分降序）

            | # | 问题 | 答案 | 类型 | 难度 | 质量分 | 需人工复核 | 复核原因 |
            | --- | --- | --- | --- | --- | --- | --- | --- |
            {% for item in qa_pairs -%}
            | {{ loop.index }} | {{ item.question }} | {{ item.answer }} | {{ item.question_type }} | {{ item.difficulty }} | {{ item.quality_score }} | {{ item.need_human_review }} | {{ item.review_reason }} |
            {% endfor %}

            ## 二、统计

            ```json
            {{ stats_json }}
            ```

            ## 三、文档摘要

            {{ doc_summary }}

            ## 四、待业务方补充的空白点

            {% for gap in coverage_gaps -%}
            - {{ gap }}
            {% endfor %}

            ## 五、入库说明

            - 质量分 ≥ 4 且无需人工复核的问答对，可直接进入知识库。
            - 标记「需人工复核」的条目，请业务专家确认后再入库。
            - 完整结构化数据见工作流输出的 `jsonl` 字段，可直接由入库脚本消费。
          title: 生成复核表
          type: template-transform
          variables:
            - value_selector:
                - '1720000000001'
                - doc_title
              variable: title
            - value_selector:
                - '1720000000001'
                - business_domain
              variable: domain
            - value_selector:
                - '1720000000003'
                - qa_pairs
              variable: qa_pairs
            - value_selector:
                - '1720000000003'
                - qa_count
              variable: qa_count
            - value_selector:
                - '1720000000003'
                - generated_at
              variable: generated_at
            - value_selector:
                - '1720000000003'
                - stats_json
              variable: stats_json
            - value_selector:
                - '1720000000003'
                - doc_summary
              variable: doc_summary
            - value_selector:
                - '1720000000003'
                - coverage_gaps
              variable: coverage_gaps
        height: 160
        id: '1720000000004'
        position:
          x: 1020
          y: 300
        positionAbsolute:
          x: 1020
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 工作流输出
          outputs:
            - value_selector:
                - '1720000000003'
                - jsonl
              value_type: string
              variable: jsonl
            - value_selector:
                - '1720000000003'
                - qa_count
              value_type: number
              variable: qa_count
            - value_selector:
                - '1720000000003'
                - stats_json
              value_type: string
              variable: stats_json
            - value_selector:
                - '1720000000004'
                - output
              value_type: string
              variable: review_markdown
          selected: false
          title: 结束
          type: end
        height: 160
        id: '1720000000005'
        position:
          x: 1340
          y: 300
        positionAbsolute:
          x: 1340
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
