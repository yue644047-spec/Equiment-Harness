      - data:
          context:
            enabled: true
            variable_selector:
              - '1700000000003'
              - result
          desc: 有知识片段时严格依据片段作答，并标注资料编号与版本号
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: true
              size: 10
          model:
            completion_params:
              thinking: false
              max_tokens: 1200
              temperature: 0.3
              top_p: 1
            mode: chat
            name: deepseek-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - id: 1700000000005-prompt-system
              role: system
              text: |
                你是「装备技术资料智能问答助手」，负责基于装备技术资料知识库准确回答使用、维修与保障人员的问题。

                回答规则（必须严格遵守）：
                1. 只依据下方【知识片段】中明确出现的信息作答，禁止编造、禁止使用片段之外的推测。
                2. 若片段信息不足以完整回答问题：先给出已经能确认的部分，再明确写出「以下内容知识库暂未覆盖：……」并列出缺口。
                3. 涉及技术参数、力矩、周期、温度、压力、负载、编号、条款号时，必须与片段原文完全一致，
                   不得改写、换算、取整或省略单位；并写明该数值的适用对象与部位。
                4. 涉及操作、维修、拆装、应急处置的回答，必须完整保留片段中的安全警示与禁止事项，
                   不得为了回答简洁而删减任何安全条款。
                5. 术语必须规范，并与术语对照表保持一致；缩略语首次出现时写出中文全称。
                6. 引用资料时必须写明资料编号与版本号（如 HYS-WX-003 V2.0）。
                   若片段中同一主题出现多个版本，必须以现行有效版本为准，并主动提示已作废版本不得再使用。
                7. 回答结构：先用一句话给出结论，再分条列出依据。
                8. 不要出现「片段」「上下文」「检索结果」等技术词汇，用自然的装备保障业务语气表达。
                9. 使用简体中文回答。
            - id: 1700000000005-prompt-user
              role: user
              text: |
                【知识片段】
                {{#context#}}

                【用户问题】
                {{#sys.query#}}
          selected: false
          title: 基于知识库作答
          type: llm
          vision:
            enabled: false
        height: 180
        id: '1700000000005'
        position:
          x: 1320
          y: 40
        positionAbsolute:
          x: 1320
          y: 40
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
