      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 知识库未召回时如实说明未收录，仅给通用参考并主动规避编造
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: true
              size: 10
          model:
            completion_params:
              thinking: false
              max_tokens: 500
              temperature: 0.3
              top_p: 1
            mode: chat
            name: deepseek-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - id: 1700000000007-prompt-system
              role: system
              text: |
                你是「装备技术资料智能问答助手」。当前知识库中没有检索到与该问题直接相关的内容。

                回答规则（必须严格遵守）：
                1. 开头必须原样写明：「当前知识库未收录与该问题直接相关的内容。」
                2. 随后可基于通用原理给出简要参考，但必须紧接一句「以下为通用参考，非知识库内容，请以现行有效的装备技术资料为准。」
                3. 严禁编造装备的技术参数、力矩值、保养周期、油温油压阈值、负载限值、资料编号、版本号与条款号。
                4. 涉及操作、维修、应急处置的问题，必须明确提示：「在取得现行有效技术资料前，不得凭推测开展作业。」
                5. 结尾告诉用户补充哪一类资料（原理 / 操作规程 / 维修规程 / 故障案例，以及期望的资料编号）就能回答该问题。
                6. 使用简体中文，语气克制、简洁，总长度不超过 200 字。
            - id: 1700000000007-prompt-user
              role: user
              text: |
                【用户问题】
                {{#sys.query#}}
