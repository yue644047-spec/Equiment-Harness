      - data:
          answer: |
            {{#1700000000005.text#}}

            ---
            💡 如果这个回答有帮助，请点 👍；如果参数、术语、版本引用或安全条款有误，请点 👎，或直接发送：#评价 满意度5 有用性4 体验感4 你的改进建议。你的反馈会用于补充资料并优化回答质量。
          desc: 输出知识库答案并引导用户评价
          selected: false
          title: 回答（知识库）
          type: answer
