app:
  description: 多模态智能问答助手。支持文本、图片、视频多模态输入与四类意图分流：知识库智能检索问答（带文档出处）、数据库交互查询（NL2SQL）、多模态内容理解（图片直读 + 解析服务）、满意度评价采集（主观 3 项指标 + 改进建议）。
  icon: 💬
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 多模态智能问答助手（知识库 + 数据库 + 多模态 + 满意度采集）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: '0.7.0'
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
        - .pdf
        - .docx
        - .xlsx
        - .md
        - .txt
        - .jpg
        - .jpeg
        - .png
        - .mp4
        - .avi
        - .mp3
        - .wav
      allowed_file_types:
        - document
        - image
        - video
        - audio
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: true
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 5
    opening_statement: |
      你好，我是多模态智能问答助手 👋
      你可以：
      1. 提问装备原理、技术参数、操作规程、维修规程、故障排除等问题，我会基于知识库作答并标注资料出处；
      2. 查询装备台账、履历、检修记录等结构化数据，我会查数据库后回答；
      3. 直接上传图片，或上传视频，我会解析画面内容后针对性地回答；
      4. 对回答打分：直接发送「#评价 满意度5 有用性4 体验感4 建议……」即可。
      涉及操作与维修的问题，我会完整给出安全前置条件与禁止事项。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 这套知识库覆盖了哪些装备技术资料
      - 滤芯多久需要更换一次
      - 液压系统额定压力是多少
      - 最近三个月有哪些设备到了检修周期
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
