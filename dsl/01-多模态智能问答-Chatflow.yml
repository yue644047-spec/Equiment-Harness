      - data:
          dataset_ids:
            - 00000000-0000-0000-0000-000000000000
          desc: 从装备技术资料知识库召回相关片段。top_k=10 系真实文档实测结论（docs/16 ADR-D21）：全集命中 50%→60%、至少命中一条 90%→100%，耗时 0.52s→0.56s；条款密集场景建议同时开启 rerank。导入后请把 dataset_ids 换成你自己的知识库 ID
