    nodes:
      - data:
          desc: 对话入口。文本走 sys.query，上传的图片/视频/文档走 sys.files
          selected: false
          title: 开始
          type: start
          variables: []
        height: 60
        id: '1700000000001'
        position:
          x: 40
          y: 460
        positionAbsolute:
          x: 40
          y: 460
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          classes:
            - id: '1'
              name: 知识库问答
            - id: '2'
              name: 数据库查询
            - id: '3'
              name: 多模态理解
            - id: '4'
              name: 满意度评价
          desc: 四路分流：知识库检索问答 / 数据库交互查询 / 图片视频理解 / 满意度评价采集
          instruction: |
            请判断用户输入属于以下哪一类，只输出类别编号，不要解释。
            1. 知识库问答：询问装备原理、技术参数、操作规程、维修规程、故障现象与排除方法、
               术语含义、资料条款等，期望从技术资料里找到答案的问题。
            2. 数据库查询：询问结构化台账类信息，例如「某型装备一共几台」「哪些设备到了检修周期」
               「上个月有几次故障」「编号 XXX 的履历」「统计一下各单位的装备数量」等
               需要对数据表做筛选、计数、排序、汇总的问题。
            3. 多模态理解：用户上传了图片或视频，并要求描述画面、判断画面中的状态、
               说明图中的操作步骤、识别图中的仪表读数或零部件等，属于对媒体内容本身的提问。
            4. 满意度评价：用户在针对之前的回答打分、点赞点踩或提出改进建议。典型形式：
               - 以 #评价 开头，后接评分与建议，例如「#评价 满意度5 有用性4 体验感4 希望补充滤芯说明」
               - 「这个回答不对」「答非所问」「不够详细」「很好，谢谢」等对上一轮回答质量的主观评价
               - 针对资料本身的反馈，例如「这个参数是作废版本的」「步骤里漏了泄压要求」

            判定优先级：
            - 若用户上传了图片/视频并且在问画面里的内容，归入第 3 类；
            - 若问题需要查结构化数据表（数量、时间、统计、清单）而不是查资料原文，归入第 2 类；
            - 若输入的主要内容是对上一轮回答的评价或改进诉求，归入第 4 类；
            - 其余寻求资料信息的问题归入第 1 类。
            注意区分：「这个力矩值是多少」是知识库问答；「这个力矩值写错了」是满意度评价；
            「一共有几台举升设备」是数据库查询；「这张图里的压力表读数是多少」是多模态理解。
          model:
            completion_params:
              thinking: false
              max_tokens: 64
              temperature: 0
            mode: chat
            name: deepseek-flash
            provider: langgenius/deepseek/deepseek
          query_variable_selector:
            - sys
            - query
          selected: false
          title: 意图识别
          topics: []
          type: question-classifier
          vision:
            enabled: false
        height: 200
        id: '1700000000002'
        position:
          x: 360
          y: 460
        positionAbsolute:
          x: 360
          y: 460
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
